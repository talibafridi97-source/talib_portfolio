name: talib_portfolio
description: "Professional Portfolio for Talib Nawaz - Full Stack Developer (Flutter | Node.js | Supabase)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  provider: ^6.1.2
  animated_text_kit: ^4.2.2
  font_awesome_flutter: ^10.7.0
  flutter_animate: ^4.5.0
  visibility_detector: ^0.4.0+2
  carousel_slider: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/cv/
